services:
  db:
    image: postgres:16-alpine
    container_name: user-service-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: user_service
    ports:
      - "5433:5432"
    volumes:
      - user_service_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d user_service"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build: .
    container_name: user-service
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app_password@db:5432/user_service
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  user_service_data: